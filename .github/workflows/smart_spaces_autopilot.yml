name: Smart Spaces 24/7 AI Autopilot

on:
  schedule:
    # Bootstrap run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
    # 5 Strategic Daily Peak Windows (UTC converted from EST)
    # Slot 1: 08:30 AM EST (13:30 UTC) - Small Apartment Hacks
    - cron: '30 13 * * *'
    # Slot 2: 12:45 PM EST (17:45 UTC) - Space Saving Kitchens
    - cron: '45 17 * * *'
    # Slot 3: 04:30 PM EST (21:30 UTC) - Closet & Wardrobe Organization
    - cron: '30 21 * * *'
    # Slot 4: 08:15 PM EST (01:15 UTC) - Studio Living Ideas
    - cron: '15 1 * * *'
    # Slot 5: 10:45 PM EST (03:45 UTC) - Room Organization
    - cron: '45 3 * * *'

  workflow_dispatch:
    inputs:
      slot:
        description: 'Publishing Slot to Execute'
        required: true
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - '1'
          - '2'
          - '3'
          - '4'
          - '5'
          - 'all'
          - 'bootstrap'
      dry_run:
        description: 'Dry Run (Test without posting live to Pinterest)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.event.schedule == '0 9 * * 1' || github.event.inputs.slot == 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_engine/requirements.txt
      - name: Execute Bootstrap Board Warmup
        continue-on-error: false
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          AMAZON_AFFILIATE_TAG: 'smartspace07-21'
        run: |
          python -m python_engine.strategic_scheduler --all --no-jitter --dry-run

  autopilot:
    if: github.event.schedule != '0 9 * * 1' && github.event.inputs.slot != 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r python_engine/requirements.txt
      - name: Execute Strategic AI Autopilot Cycle
        continue-on-error: false
        timeout-minutes: 10
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          AMAZON_AFFILIATE_TAG: 'smartspace07-21'
        run: |
          SLOT_ARG=""
          if [ "${{ github.event.inputs.slot }}" = "all" ]; then
            SLOT_ARG="--all"
          elif [ "${{ github.event.inputs.slot }}" = "1" ] || [ "${{ github.event.inputs.slot }}" = "2" ] || [ "${{ github.event.inputs.slot }}" = "3" ] || [ "${{ github.event.inputs.slot }}" = "4" ] || [ "${{ github.event.inputs.slot }}" = "5" ]; then
            SLOT_ARG="--slot ${{ github.event.inputs.slot }}"
          else
            SLOT_ARG="--auto"
          fi

          DRY_ARG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi

          python -m python_engine.strategic_scheduler $SLOT_ARG $DRY_ARG

      - name: Commit & Push Autopilot History
        if: success()
        run: |
          git config --local user.email "bot@smartspaces.internal"
          git config --local user.name "Smart Spaces Autopilot"
          git add python_engine/data/seen_products.json python_engine/data/autopilot_history.json || true
          if git diff --staged --quiet; then
            echo "No new history changes to commit."
          else
            git commit -m "chore(autopilot): update deduplication and execution logs [skip ci]"
            git push origin main
          fi
